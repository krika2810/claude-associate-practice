<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100d"><title>Claude Associate Practice Lab</title><meta name="description" content="Two original 60-question practice sets for the Claude Certified Associate – Foundations exam."><style>@font-face{font-family:Diatype;src:url('fonts/AWSDiatype-Regular.woff2')}@font-face{font-family:Diatype;src:url('fonts/AWSDiatype-Bold.woff2');font-weight:700}@font-face{font-family:Mono;src:url('fonts/FragmentMono-Regular.woff2')}*{box-sizing:border-box}html{scroll-behavior:smooth}:root{--bg:#07100d;--panel:#0d1915;--panel2:#11221c;--ink:#f2f1e8;--muted:#a7b7ad;--line:#244237;--lime:#b5f36a;--mint:#6ee7b7;--red:#ff8a7a;--amber:#ffd166}body.light{--bg:#f2f0e7;--panel:#fff;--panel2:#e9eee7;--ink:#102018;--muted:#52645a;--line:#c8d2c9;--lime:#4f7f16;--mint:#177a58;--red:#c43c2b;--amber:#9a6c00}body{margin:0;background:var(--bg);color:var(--ink);font-family:Diatype,system-ui;line-height:1.45}header{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1120px)/2));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{color:var(--ink);text-decoration:none;font-size:18px}.brand b{color:var(--lime)}button{font:inherit}#theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;width:40px;height:40px}main{max-width:1120px;margin:auto;padding:52px 20px 80px}.eyebrow{font:12px Mono;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.045em;max-width:900px;margin:14px 0 24px}.lead{font-size:clamp(18px,2vw,22px);color:var(--muted);max-width:760px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 46px}.pill{font:13px Mono;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.set-grid,.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:25px}.card h2{font-size:28px;margin:3px 0 8px}.card p{color:var(--muted)}.progressline{height:7px;background:var(--bg);border-radius:10px;overflow:hidden;margin:20px 0 10px}.progressline i{display:block;height:100%;width:0;background:var(--lime)}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:10px;background:var(--lime);color:#10200c;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}section{margin-top:70px}section h2{font-size:34px;margin-bottom:10px}.blueprint{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:24px 0}.dom{min-height:125px;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--panel)}.dom strong{font:22px Mono;color:var(--lime)}.dom span{display:block;font-size:13px;color:var(--muted);margin-top:8px}.source-grid{grid-template-columns:repeat(3,1fr)}.source-card{display:block;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:13px;padding:17px;background:var(--panel)}.source-card small{color:var(--lime);font:11px Mono}.source-card p{color:var(--muted);font-size:14px;margin:7px 0 0}.quiztop{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:25px}.quiztop h1{font-size:34px;margin:0}.score{font:13px Mono;color:var(--muted)}.layout{display:grid;grid-template-columns:230px 1fr;gap:25px}.sidebar{position:sticky;top:86px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.sideitem{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:8px 4px;color:var(--muted)}.sideitem.active{color:var(--lime)}.qcard{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:clamp(20px,4vw,38px)}.qhead{display:flex;justify-content:space-between;gap:10px;font:12px Mono;color:var(--muted)}.qcard h2{font-size:clamp(22px,3vw,31px);line-height:1.23;margin:22px 0}.instruction{color:var(--amber);font:13px Mono;margin-bottom:15px}.options{display:grid;gap:10px}.option{display:grid;grid-template-columns:34px 1fr;gap:12px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--panel2);cursor:pointer}.option:hover{border-color:var(--mint)}.option b{font:13px Mono;width:27px;height:27px;border:1px solid var(--line);display:grid;place-items:center;border-radius:7px}.option.selected{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}.option.correct{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--panel))}.option.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--panel))}.feedback{margin-top:20px;border-left:4px solid var(--mint);background:var(--panel2);padding:17px 19px;border-radius:3px 12px 12px 3px}.feedback.bad{border-color:var(--red)}.feedback strong{display:block;margin-bottom:7px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.domainjump{display:flex;gap:7px;overflow:auto;padding:2px 0 14px}.domainjump button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 10px;border-radius:8px}.result{max-width:780px;margin:auto;text-align:center}.result .big{font-size:90px;line-height:1;color:var(--lime);font-weight:700}.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:30px 0}.resultrow{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}footer{border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);font-size:13px;text-align:center}@media(max-width:800px){main{padding-top:34px}.set-grid,.source-grid{grid-template-columns:1fr}.blueprint{grid-template-columns:repeat(2,1fr)}.layout{display:block}.sidebar{display:none}.qcard{padding:20px}.quiztop{align-items:flex-start}.option{padding:13px}.resultgrid{grid-template-columns:1fr}}@media(max-width:420px){.brand{font-size:15px}.blueprint{grid-template-columns:1fr 1fr}.dom{min-height:110px}h1{font-size:44px}.meta{margin-bottom:32px}.qcard h2{font-size:22px}.actions .btn{padding:11px 13px}}
</style></head><body><header><a class="brand" href="#">Claude Associate <b>Practice Lab</b></a><button id="theme" aria-label="Toggle theme">◐</button></header><main id="app"></main><footer>Original practice questions aligned to the official CCAO-F v1.0 blueprint. Not affiliated with or endorsed by Anthropic.</footer><script>window.BANK={"domains":[[1,"Prompting and Task Execution",14],[2,"Output Evaluation and Validation",21],[3,"Product and Model Selection",12],[4,"Workflow Integration and Solution Design",16],[5,"Configuration and Knowledge Management",12],[6,"Governance, Risk, and Responsible Use",15],[7,"Troubleshooting and Optimization",10]],"questions":[{"id":1,"set":1,"domain":1,"stem":"Which prompt is best for a operations lead who needs to turn weekly incident notes into a clear leadership update?","options":["\"turn weekly incident notes into a clear leadership update.\"","\"Act as an expert and make it perfect.\"","\"Using the attached approved material, turn weekly incident notes into a clear leadership update. Include audience, decision needed, source notes, and required format. Mark missing evidence instead of guessing.\"","\"Think step by step and do whatever you think is best.\""],"correct":[2],"why":"The strongest option supplies grounded inputs, task context, success conditions, and a rule for missing evidence. A persona or generic request cannot replace those details.","multi":false},{"id":2,"set":1,"domain":1,"stem":"A marketing manager asks Claude to draft a launch brief from approved product facts, but the request is too large for one reliable pass. What is the best next step?","options":["Ask for the final answer again with more urgency","Break the work into stages, define the output of each stage, and validate before continuing","Remove all context to make the prompt shorter","Ask Claude to choose unstated business priorities"],"correct":[1],"why":"Task decomposition reduces hidden assumptions and creates review points. The other choices either repeat the same failure or discard information needed for the task.","multi":false},{"id":3,"set":1,"domain":1,"stem":"Which prompt is best for a project manager who needs to compare three delivery plans?","options":["\"compare three delivery plans.\"","\"Act as an expert and make it perfect.\"","\"Using the attached approved material, compare three delivery plans. Include decision criteria, constraints, evidence, and a comparison table. Mark missing evidence instead of guessing.\"","\"Think step by step and do whatever you think is best.\""],"correct":[2],"why":"The strongest option supplies grounded inputs, task context, success conditions, and a rule for missing evidence. A persona or generic request cannot replace those details.","multi":false},{"id":4,"set":1,"domain":1,"stem":"A HR partner must summarize employee survey themes. Which THREE prompt elements most directly improve the first response?","options":["scope","anonymized source data","audience, and categories","A request that Claude \"be brilliant\"","An instruction to hide uncertainty"],"correct":[0,1,2],"why":"Strong prompts make the task, evidence, constraints, audience, and output explicit. Vague praise and hiding uncertainty do not add usable direction.","multi":true},{"id":5,"set":1,"domain":1,"stem":"A teacher asks Claude to create a lesson plan from a curriculum excerpt, but the request is too large for one reliable pass. What is the best next step?","options":["Ask for the final answer again with more urgency","Break the work into stages, define the output of each stage, and validate before continuing","Remove all context to make the prompt shorter","Ask Claude to choose unstated business priorities"],"correct":[1],"why":"Task decomposition reduces hidden assumptions and creates review points. The other choices either repeat the same failure or discard information needed for the task.","multi":false},{"id":6,"set":1,"domain":1,"stem":"Which prompt is best for a sales operations analyst who needs to identify causes of pipeline slippage?","options":["\"identify causes of pipeline slippage.\"","\"Act as an expert and make it perfect.\"","\"Using the attached approved material, identify causes of pipeline slippage. Include definitions, clean input data, comparison period, and output schema. Mark missing evidence instead of guessing.\"","\"Think step by step and do whatever you think is best.\""],"correct":[2],"why":"The strongest option supplies grounded inputs, task context, success conditions, and a rule for missing evidence. A persona or generic request cannot replace those details.","multi":false},{"id":7,"set":1,"domain":1,"stem":"Which prompt is best for a communications lead who needs to adapt a technical memo for executives?","options":["\"adapt a technical memo for executives.\"","\"Act as an expert and make it perfect.\"","\"Using the attached approved material, adapt a technical memo for executives. Include target audience, decisions required, source memo, and length. Mark missing evidence instead of guessing.\"","\"Think step by step and do whatever you think is best.\""],"correct":[2],"why":"The strongest option supplies grounded inputs, task context, success conditions, and a rule for missing evidence. A persona or generic request cannot replace those details.","multi":false},{"id":8,"set":1,"domain":1,"stem":"A customer success manager must prepare renewal-risk summaries. Which THREE prompt elements most directly improve the first response?","options":["risk criteria","account evidence","desired format, and escalation rule","A request that Claude \"be brilliant\"","An instruction to hide uncertainty"],"correct":[0,1,2],"why":"Strong prompts make the task, evidence, constraints, audience, and output explicit. Vague praise and hiding uncertainty do not add usable direction.","multi":true},{"id":9,"set":1,"domain":2,"stem":"Claude returns a regulation summary with a subsection citation confidently. What is the most appropriate next action?","options":["Share it because fluent language indicates reliability","Verify the important claims against the official regulation text and obtain the needed human review","Only ask Claude to rewrite it in a cautious tone","Delete it and avoid using Claude for the task"],"correct":[1],"why":"Fluency is not accuracy. The right response is proportionate verification and human review, not blind acceptance or abandoning a useful workflow.","multi":false},{"id":10,"set":1,"domain":2,"stem":"Two Claude drafts of a board memo containing quarterly revenue figures differ. What is the most reliable way to select between them?","options":["Choose the longer draft","Choose the draft with the strongest tone","Score both against the same criteria and verify disputed claims using the signed finance report","Ask Claude which draft it prefers and accept that answer"],"correct":[2],"why":"A shared rubric plus external verification makes the comparison repeatable and evidence-based. Length, tone, or model preference do not establish correctness.","multi":false},{"id":11,"set":1,"domain":2,"stem":"Claude produces a medical-information handout. Which THREE checks should happen before it is used?","options":["Compare material claims with approved clinical guidance and expert review","Check that the output covers the requested scope","Check tone and format for the intended audience","Accept every citation because it looks specific","Use Claude’s confidence statement as proof"],"correct":[0,1,2],"why":"Validation covers factual support, completeness, and fitness for the audience. Specific-looking citations and self-reported confidence are not evidence.","multi":true},{"id":12,"set":1,"domain":2,"stem":"Claude cannot find a value needed for a hiring summary that ranks candidates. What should the associate prefer?","options":["A plausible estimate with no label","A confident sentence that avoids the gap","An explicit \"not found in the provided sources\" marker and a request for the missing evidence","A fabricated citation that can be checked later"],"correct":[2],"why":"Clearly surfacing missing evidence preserves traceability and invites the right follow-up. Guessing turns an information gap into a hidden error.","multi":false},{"id":13,"set":1,"domain":2,"stem":"Claude returns a market report quoting competitor prices confidently. What is the most appropriate next action?","options":["Share it because fluent language indicates reliability","Verify the important claims against current first-party pricing pages and obtain the needed human review","Only ask Claude to rewrite it in a cautious tone","Delete it and avoid using Claude for the task"],"correct":[1],"why":"Fluency is not accuracy. The right response is proportionate verification and human review, not blind acceptance or abandoning a useful workflow.","multi":false},{"id":14,"set":1,"domain":2,"stem":"Two Claude drafts of a contract summary stating termination dates differ. What is the most reliable way to select between them?","options":["Choose the longer draft","Choose the draft with the strongest tone","Score both against the same criteria and verify disputed claims using the executed agreement","Ask Claude which draft it prefers and accept that answer"],"correct":[2],"why":"A shared rubric plus external verification makes the comparison repeatable and evidence-based. Length, tone, or model preference do not establish correctness.","multi":false},{"id":15,"set":1,"domain":2,"stem":"Claude returns a customer incident report naming root cause confidently. What is the most appropriate next action?","options":["Share it because fluent language indicates reliability","Verify the important claims against system logs and the incident owner and obtain the needed human review","Only ask Claude to rewrite it in a cautious tone","Delete it and avoid using Claude for the task"],"correct":[1],"why":"Fluency is not accuracy. The right response is proportionate verification and human review, not blind acceptance or abandoning a useful workflow.","multi":false},{"id":16,"set":1,"domain":2,"stem":"Claude produces a policy answer describing employee benefits. Which THREE checks should happen before it is used?","options":["Compare material claims with the current approved policy","Check that the output covers the requested scope","Check tone and format for the intended audience","Accept every citation because it looks specific","Use Claude’s confidence statement as proof"],"correct":[0,1,2],"why":"Validation covers factual support, completeness, and fitness for the audience. Specific-looking citations and self-reported confidence are not evidence.","multi":true},{"id":17,"set":1,"domain":2,"stem":"Claude returns an executive brief quoting survey percentages confidently. What is the most appropriate next action?","options":["Share it because fluent language indicates reliability","Verify the important claims against the cleaned survey dataset and obtain the needed human review","Only ask Claude to rewrite it in a cautious tone","Delete it and avoid using Claude for the task"],"correct":[1],"why":"Fluency is not accuracy. The right response is proportionate verification and human review, not blind acceptance or abandoning a useful workflow.","multi":false},{"id":18,"set":1,"domain":2,"stem":"Two Claude drafts of a research note citing academic papers differ. What is the most reliable way to select between them?","options":["Choose the longer draft","Choose the draft with the strongest tone","Score both against the same criteria and verify disputed claims using the original papers","Ask Claude which draft it prefers and accept that answer"],"correct":[2],"why":"A shared rubric plus external verification makes the comparison repeatable and evidence-based. Length, tone, or model preference do not establish correctness.","multi":false},{"id":19,"set":1,"domain":2,"stem":"Claude returns a press response containing product claims confidently. What is the most appropriate next action?","options":["Share it because fluent language indicates reliability","Verify the important claims against the approved claims library and communications owner and obtain the needed human review","Only ask Claude to rewrite it in a cautious tone","Delete it and avoid using Claude for the task"],"correct":[1],"why":"Fluency is not accuracy. The right response is proportionate verification and human review, not blind acceptance or abandoning a useful workflow.","multi":false},{"id":20,"set":1,"domain":2,"stem":"Claude cannot find a value needed for a tax-process guide. What should the associate prefer?","options":["A plausible estimate with no label","A confident sentence that avoids the gap","An explicit \"not found in the provided sources\" marker and a request for the missing evidence","A fabricated citation that can be checked later"],"correct":[2],"why":"Clearly surfacing missing evidence preserves traceability and invites the right follow-up. Guessing turns an information gap into a hidden error.","multi":false},{"id":21,"set":1,"domain":2,"stem":"Claude produces a supplier assessment describing certifications. Which THREE checks should happen before it is used?","options":["Compare material claims with current certification records","Check that the output covers the requested scope","Check tone and format for the intended audience","Accept every citation because it looks specific","Use Claude’s confidence statement as proof"],"correct":[0,1,2],"why":"Validation covers factual support, completeness, and fitness for the audience. Specific-looking citations and self-reported confidence are not evidence.","multi":true},{"id":22,"set":1,"domain":3,"stem":"A team needs thousands of short FAQ drafts; speed and low cost matter; the task is straightforward. Which model family is the best starting point?","options":["Haiku","Sonnet","Opus","The largest model in every case"],"correct":[0],"why":"Haiku is the best starting fit for this trade-off. Model selection should match complexity, latency, quality, and cost, then be tested on representative work.","multi":false},{"id":23,"set":1,"domain":3,"stem":"A team needs a nuanced strategy memo with difficult trade-offs; deep reasoning and quality matter more than latency. Which model family is the best starting point?","options":["Haiku","Sonnet","Opus","The largest model in every case"],"correct":[2],"why":"Opus is the best starting fit for this trade-off. Model selection should match complexity, latency, quality, and cost, then be tested on representative work.","multi":false},{"id":24,"set":1,"domain":3,"stem":"A team needs routine analysis with solid quality at balanced cost; quality, speed, and cost all matter. Which model family is the best starting point?","options":["Haiku","Sonnet","Opus","The largest model in every case"],"correct":[1],"why":"Sonnet is the best starting fit for this trade-off. Model selection should match complexity, latency, quality, and cost, then be tested on representative work.","multi":false},{"id":25,"set":1,"domain":3,"stem":"A team needs rapid classification of simple feedback labels; high throughput and consistency matter. Which model family is the best starting point?","options":["Haiku","Sonnet","Opus","The largest model in every case"],"correct":[0],"why":"Haiku is the best starting fit for this trade-off. Model selection should match complexity, latency, quality, and cost, then be tested on representative work.","multi":false},{"id":26,"set":1,"domain":3,"stem":"A team needs complex cross-document reasoning for an executive decision; maximum reasoning quality matters. Which model family is the best starting point?","options":["Haiku","Sonnet","Opus","The largest model in every case"],"correct":[2],"why":"Opus is the best starting fit for this trade-off. Model selection should match complexity, latency, quality, and cost, then be tested on representative work.","multi":false},{"id":27,"set":1,"domain":3,"stem":"A conversation has accumulated many outdated drafts and Claude is mixing old and new decisions. Which TWO actions best restore reliable context?","options":["Continue in the same thread and repeat the latest instruction","Create a concise handoff of current facts and decisions","Start a new conversation using that handoff","Upload more unrelated background"],"correct":[1,2],"why":"A clean restart plus a standalone summary removes stale context while preserving current decisions. Repetition in a polluted thread and unrelated material add noise.","multi":true},{"id":28,"set":1,"domain":3,"stem":"Which product feature is the best home for recurring work that needs stable instructions and a maintained set of reference files?","options":["A fresh temporary chat for every task","A Claude Project","An image artifact","A model switch without instructions"],"correct":[1],"why":"A Project keeps task-specific instructions and knowledge together across related work. A model choice or artifact does not manage recurring context.","multi":false},{"id":29,"set":1,"domain":4,"stem":"Before adding Claude to weekly status reporting, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":30,"set":1,"domain":4,"stem":"Which sequence is the strongest design for proposal development?","options":["clarify requirements, research evidence, draft sections, review claims, then finalize","Generate a final output first, then look for requirements","Automate the current process unchanged and measure nothing","Let Claude choose sources, policy, and approval rules"],"correct":[0],"why":"The best sequence decomposes the workflow, grounds it in inputs, and includes validation or ownership. Claude supports the work; it does not inherit governance or business authority.","multi":false},{"id":31,"set":1,"domain":4,"stem":"Before adding Claude to meeting follow-up, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":32,"set":1,"domain":4,"stem":"Before adding Claude to customer feedback analysis, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":33,"set":1,"domain":4,"stem":"A team is redesigning policy Q&A. Which THREE design choices best support a dependable workflow?","options":["Define the business outcome and success measure","Place verification or approval where errors matter","Assign owners for inputs, exceptions, and final decisions","Automate every decision immediately","Hide limitations from stakeholders"],"correct":[0,1,2],"why":"A dependable workflow starts with the outcome, adds controls at risk points, and preserves ownership. Automation scope should follow evidence, and limits should be communicated.","multi":true},{"id":34,"set":1,"domain":4,"stem":"Before adding Claude to campaign planning, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":35,"set":1,"domain":4,"stem":"Before adding Claude to vendor comparison, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":36,"set":1,"domain":4,"stem":"Which sequence is the strongest design for incident communication?","options":["confirm facts, tailor by audience, obtain incident-owner approval, then distribute","Generate a final output first, then look for requirements","Automate the current process unchanged and measure nothing","Let Claude choose sources, policy, and approval rules"],"correct":[0],"why":"The best sequence decomposes the workflow, grounds it in inputs, and includes validation or ownership. Claude supports the work; it does not inherit governance or business authority.","multi":false},{"id":37,"set":1,"domain":4,"stem":"Before adding Claude to training design, what should the associate do first?","options":["Pick the most expensive model","Map the current goal, inputs, decisions, pain points, risks, and owners","Promise stakeholders that the workflow will be fully autonomous","Remove all human review"],"correct":[1],"why":"Workflow design starts with the business process and its failure modes. Product and automation choices follow from that analysis.","multi":false},{"id":38,"set":1,"domain":4,"stem":"A team is redesigning research synthesis. Which THREE design choices best support a dependable workflow?","options":["Define the business outcome and success measure","Place verification or approval where errors matter","Assign owners for inputs, exceptions, and final decisions","Automate every decision immediately","Hide limitations from stakeholders"],"correct":[0,1,2],"why":"A dependable workflow starts with the outcome, adds controls at risk points, and preserves ownership. Automation scope should follow evidence, and limits should be communicated.","multi":true},{"id":39,"set":1,"domain":5,"stem":"What belongs in the initial configuration for a brand-content Project?","options":["brand voice, approved terminology, forbidden claims, audience rules, and current brand files","Every file the team can access, whether relevant or not","Only a one-line instruction to be helpful","Unverified web content copied without dates or owners"],"correct":[0],"why":"The best configuration contains task-relevant rules and authoritative, maintained knowledge. More context is not automatically better.","multi":false},{"id":40,"set":1,"domain":5,"stem":"The HR policy Project gives inconsistent answers after several contributors added instructions. What is the best fix?","options":["Add more instructions without reading the old ones","Consolidate conflicts, prioritize rules, keep them concise, and test common tasks","Switch models and leave the conflicts in place","Tell users to ignore inconsistent answers"],"correct":[1],"why":"System-level instructions should be clear, ordered, and maintainable. Model changes do not repair contradictory configuration.","multi":false},{"id":41,"set":1,"domain":5,"stem":"Which THREE maintenance actions keep a proposal Project trustworthy?","options":["Assign an owner to review instructions and sources","Remove or replace superseded files","Test representative tasks after changes","Keep conflicting versions so Claude can decide","Treat connectors as permanently current without checks"],"correct":[0,1,2],"why":"Configurations need ownership, source hygiene, and regression checks. Conflicting sources and assumed freshness create silent failure.","multi":true},{"id":42,"set":1,"domain":5,"stem":"What belongs in the initial configuration for a support Project?","options":["approved knowledge, reply style, troubleshooting order, and escalation conditions","Every file the team can access, whether relevant or not","Only a one-line instruction to be helpful","Unverified web content copied without dates or owners"],"correct":[0],"why":"The best configuration contains task-relevant rules and authoritative, maintained knowledge. More context is not automatically better.","multi":false},{"id":43,"set":1,"domain":5,"stem":"The research Project gives inconsistent answers after several contributors added instructions. What is the best fix?","options":["Add more instructions without reading the old ones","Consolidate conflicts, prioritize rules, keep them concise, and test common tasks","Switch models and leave the conflicts in place","Tell users to ignore inconsistent answers"],"correct":[1],"why":"System-level instructions should be clear, ordered, and maintainable. Model changes do not repair contradictory configuration.","multi":false},{"id":44,"set":1,"domain":5,"stem":"What belongs in the initial configuration for a training Project?","options":["learner level, learning objectives, approved curriculum, and accessibility rules","Every file the team can access, whether relevant or not","Only a one-line instruction to be helpful","Unverified web content copied without dates or owners"],"correct":[0],"why":"The best configuration contains task-relevant rules and authoritative, maintained knowledge. More context is not automatically better.","multi":false},{"id":45,"set":1,"domain":5,"stem":"Which THREE maintenance actions keep a operations Project trustworthy?","options":["Assign an owner to review instructions and sources","Remove or replace superseded files","Test representative tasks after changes","Keep conflicting versions so Claude can decide","Treat connectors as permanently current without check eat connectors as permanently current without checks"],"correct":[0,1,2],"why":"Configurations need ownership, source hygiene, and regression checks. Conflicting sources and assumed freshness create silent failure.","multi":true},{"id":106,"set":2,"domain":6,"stem":"An associate is asked to analyze student records with grades and IDs. What is the most appropriate response?","options":["de-identify the records and follow education-data policy","Upload it first and check policy later","Tell Claude that the data is confidential and proceed","Move it to a personal account to avoid organizational restrictions"],"correct":[0],"why":"Responsible use follows the organization’s data rules before processing. A label inside a prompt or a different account is not a security control.","multi":false},{"id":107,"set":2,"domain":6,"stem":"A team wants to use support tickets containing passwords with Claude. Which THREE questions must be answered first?","options":["Does policy permit this data in the chosen environment?","Can the data be minimized, redacted, or anonymized?","Who is accountable for access and review?","Will a more confident prompt remove the privacy risk?","Can the policy be skipped because the use is internal?"],"correct":[0,1,2],"why":"Data use depends on policy, minimization, access, and accountability. Prompt wording and internal intent do not override privacy or regulatory controls.","multi":true},{"id":108,"set":2,"domain":6,"stem":"Which action best preserves responsible human ownership when Claude is used with legal matter notes under privilege?","options":["Let Claude make the final high-impact decision","Assign a qualified human to review evidence, exceptions, and the final decision","Accept the output if most sentences look reasonable","Remove the audit trail to reduce storage"],"correct":[1],"why":"High-impact or sensitive decisions need qualified human ownership and an auditable review path. Statistical plausibility is not individual correctness.","multi":false},{"id":109,"set":2,"domain":6,"stem":"An associate is asked to analyze biometric access logs. What is the most appropriate response?","options":["apply privacy, retention, and purpose-limitation requirements","Upload it first and check policy later","Tell Claude that the data is confidential and proceed","Move it to a personal account to avoid organizational restrictions"],"correct":[0],"why":"Responsible use follows the organization’s data rules before processing. A label inside a prompt or a different account is not a security control.","multi":false},{"id":110,"set":2,"domain":6,"stem":"An associate is asked to analyze customer call transcripts. What is the most appropriate response?","options":["remove unnecessary personal data and confirm consent and retention rules","Upload it first and check policy later","Tell Claude that the data is confidential and proceed","Move it to a personal account to avoid organizational restrictions"],"correct":[0],"why":"Responsible use follows the organization’s data rules before processing. A label inside a prompt or a different account is not a security control.","multi":false},{"id":111,"set":2,"domain":6,"stem":"A team wants to use candidate applications with Claude. Which THREE questions must be answered first?","options":["Does policy permit this data in the chosen environment?","Can the data be minimized, redacted, or anonymized?","Who is accountable for access and review?","Will a more confident prompt remove the privacy risk?","Can the policy be skipped because the use is internal?"],"correct":[0,1,2],"why":"Data use depends on policy, minimization, access, and accountability. Prompt wording and internal intent do not override privacy or regulatory controls.","multi":true},{"id":112,"set":2,"domain":6,"stem":"An associate is asked to analyze source code containing API keys. What is the most appropriate response?","options":["remove and rotate the keys; use a secret store","Upload it first and check policy later","Tell Claude that the data is confidential and proceed","Move it to a personal account to avoid organizational restrictions"],"correct":[0],"why":"Responsible use follows the organization’s data rules before processing. A label inside a prompt or a different account is not a security control.","multi":false},{"id":113,"set":2,"domain":6,"stem":"An associate is asked to analyze cross-border customer records. What is the most appropriate response?","options":["check data-location and transfer requirements before use","Upload it first and check policy later","Tell Claude that the data is confidential and proceed","Move it to a personal account to avoid organizational restrictions"],"correct":[0],"why":"Responsible use follows the organization’s data rules before processing. A label inside a prompt or a different account is not a security control.","multi":false},{"id":114,"set":2,"domain":6,"stem":"Which action best preserves responsible human ownership when Claude is used with children’s personal information?","options":["Let Claude make the final high-impact decision","Assign a qualified human to review evidence, exceptions, and the final decision","Accept the output if most sentences look reasonable","Remove the audit trail to reduce storage"],"correct":[1],"why":"High-impact or sensitive decisions need qualified human ownership and an auditable review path. Statistical plausibility is not individual correctness.","multi":false},{"id":115,"set":2,"domain":7,"stem":"A team reports that a long chat starts contradicting earlier decisions. What is the best first correction?","options":["summarize durable decisions and restart with clean context","Repeat the same prompt in capital letters","Always move to the largest model before diagnosis","Add unrelated context to make the prompt longer"],"correct":[0],"why":"The correction targets the likely failure source and can be tested. Urgency, model size, and extra context are not substitutes for diagnosis.","multi":false},{"id":116,"set":2,"domain":7,"stem":"A team reports that responses are too generic. What is the best first correction?","options":["supply concrete context, audience, constraints, and success criteria","Repeat the same prompt in capital letters","Always move to the largest model before diagnosis","Add unrelated context to make the prompt longer"],"correct":[0],"why":"The correction targets the likely failure source and can be tested. Urgency, model size, and extra context are not substitutes for diagnosis.","multi":false},{"id":117,"set":2,"domain":7,"stem":"A team reports that a workflow is slow and expensive for simple tasks. What is the best first correction?","options":["test a smaller model on a representative evaluation set","Repeat the same prompt in capital letters","Always move to the largest model before diagnosis","Add unrelated context to make the prompt longer"],"correct":[0],"why":"The correction targets the likely failure source and can be tested. Urgency, model size, and extra context are not substitutes for diagnosis.","multi":false},{"id":118,"set":2,"domain":7,"stem":"A team reports that summaries invent missing values. What is the best first correction?","options":["tell Claude to mark missing data explicitly and verify against source rows","Repeat the same prompt in capital letters","Always move to the largest model before diagnosis","Add unrelated context to make the prompt longer"],"correct":[0],"why":"The correction targets the likely failure source and can be tested. Urgency, model size, and extra context are not substitutes for diagnosis.","multi":false},{"id":119,"set":2,"domain":7,"stem":"A workflow improves after one prompt edit. Which TWO steps best show the improvement is real?","options":["Run the old and new versions on the same representative cases","Measure against predefined quality and efficiency criteria","Judge from one unusually good output","Change the model, prompt, and data simultaneously"],"correct":[0,1],"why":"A controlled comparison on representative work isolates the change and uses repeatable measures. One anecdote or many simultaneous changes cannot establish cause.","multi":true},{"id":120,"set":2,"domain":7,"stem":"A team reports that classification accuracy drops on unusual cases. What is the best first correction?","options":["add representative edge cases and a human-review threshold","Repeat the same prompt in capital letters","Always move to the largest model before diagnosis","Add unrelated context to make the prompt longer"],"correct":[0],"why":"The correction targets the likely failure source and can be tested. Urgency, model size, and extra context are not substitutes for diagnosis.","multi":false}]};const {domains,questions}=window.BANK;const app=document.querySelector('#app');let state={set:1,index:0,selected:[],checked:false};const key=s=>`ccao-practice-v1-set-${s}`;const saved=s=>JSON.parse(localStorage.getItem(key(s))||'{"answers":{},"complete":false}');const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('theme')==='light')document.body.classList.add('light');
function home(){let sets=[1,2].map(s=>{let p=saved(s),done=Object.keys(p.answers||{}).length;return `<article class="card"><div class="eyebrow">Practice set ${s}</div><h2>60 exam-style questions</h2><p>Blueprint-weighted scenarios across all seven domains. ${s===1?'Build your baseline.':'Test transfer, edge cases, and judgment.'}</p><div class="progressline"><i style="width:${done/60*100}%"></i></div><p>${done}/60 answered</p><button class="btn" onclick="start(${s})">${done?'Continue':'Start set'} ${s}</button></article>`}).join('');app.innerHTML=`<div class="eyebrow">CCAO-F · Foundations · Practice</div><h1>Practice judgment, not question memorization.</h1><p class="lead">120 original questions built against the official Claude Certified Associate – Foundations blueprint. Answer, get instant feedback, understand why, and see where to revise.</p><div class="meta"><span class="pill">2 × 60 questions</span><span class="pill">Single + multiple response</span><span class="pill">Saved on this device</span><span class="pill">120-minute exam</span></div><div class="set-grid">${sets}</div><section><div class="eyebrow">Official blueprint</div><h2>Coverage follows the exam weight.</h2><p class="lead">Each 60-question set uses 8 / 13 / 7 / 10 / 7 / 9 / 6 questions across Domains 1–7, a close whole-question match to the published 14 / 21 / 12 / 16 / 12 / 15 / 10% weighting.</p><div class="blueprint">${domains.map(d=>`<div class="dom"><strong>${d[2]}%</strong><span>D${d[0]} · ${d[1]}</span></div>`).join('')}</div></section><section><div class="eyebrow">Other places to practise</div><h2>Existing question sites found in research</h2><p class="lead">Use these to see more styles, but prefer the official blueprint when a third-party answer conflicts. “Exam dump” claims are not treated as authoritative.</p><div class="source-grid">${[['Preporato','https://preporato.com/free/claude-certified-associate-foundations/questions','Free browser-based CCAO-F questions.'],['HOW TO // AI','https://howtoai.com/ccao-f-practice-questions/','Free Associate practice questions with explanations.'],['OpenExamPrep','https://open-exam-prep.com/practice/anthropic-ccao-f','Free interactive CCAO-F practice.'],['Tutorials Dojo','https://portal.tutorialsdojo.com/courses/free-claude-certified-associate-foundations-ccao-f-practice-exams-sampler/','Free sampler; account may be required.'],['Claude Certified','https://claudecertified.io/practice','Practice and mock-exam hub.'],['GitHub prep set','https://github.com/shourabhmodak/claude-certified-associate-exam-prep','Open-source community question set.']].map(x=>`<a class="source-card" target="_blank" rel="noreferrer" href="${x[1]}"><small>EXTERNAL ↗</small><b>${x[0]}</b><p>${x[2]}</p></a>`).join('')}</div></section><section><div class="eyebrow">Primary sources</div><h2>What this practice lab is based on</h2><div class="source-grid"><a class="source-card" target="_blank" href="https://anthropic-partners.skilljar.com/claude-certified-associate-foundations-certification"><small>OFFICIAL ↗</small><b>Associate certification page</b><p>Current exam page and exam-guide download.</p></a><a class="source-card" target="_blank" href="https://anthropic-partners.skilljar.com/path/claude-certified-associate-foundations"><small>OFFICIAL ↗</small><b>Associate prep course</b><p>Official preparation path and product foundations.</p></a><a class="source-card" target="_blank" href="https://www.pearsonvue.com/us/en/anthropic.html"><small>OFFICIAL ↗</small><b>Pearson VUE</b><p>Exam delivery and scheduling information.</p></a></div></section>`;scrollTo(0,0)}
window.start=s=>{state={set:s,index:0,selected:[],checked:false};let p=saved(s),qs=questions.filter(q=>q.set===s);state.index=Math.min(Object.keys(p.answers||{}).length,59);renderQ()};
function renderQ(){let qs=questions.filter(q=>q.set===state.set),q=qs[state.index],p=saved(state.set),prior=p.answers?.[q.id];state.selected=prior?.selected||[];state.checked=!!prior;let answered=Object.keys(p.answers||{}).length;app.innerHTML=`<div class="quiztop"><div><div class="eyebrow">Practice set ${state.set}</div><h1>Question ${state.index+1} of 60</h1></div><div class="score">${answered}/60 answered</div></div><div class="domainjump">${domains.map(d=>`<button onclick="jump(${d[0]})">D${d[0]} · ${d[1].split(' ')[0]}</button>`).join('')}</div><div class="layout"><aside class="sidebar">${domains.map(d=>{let total=qs.filter(x=>x.domain===d[0]).length,done=qs.filter(x=>x.domain===d[0]&&p.answers?.[x.id]).length;return `<div class="sideitem ${q.domain===d[0]?'active':''}"><span>D${d[0]} ${d[1]}</span><b>${done}/${total}</b></div>`}).join('')}<hr style="border:0;border-top:1px solid var(--line)"><button class="btn secondary" onclick="home()">Exit set</button></aside><article class="qcard"><div class="qhead"><span>DOMAIN ${q.domain}</span><span>${domains[q.domain-1][1]}</span></div><h2>${esc(q.stem)}</h2><div class="instruction">${q.multi?`Select ${q.correct.length} answers`:'Select one answer'}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${state.selected.includes(i)?'selected':''} ${state.checked?(q.correct.includes(i)?'correct':state.selected.includes(i)?'wrong':''):''}" onclick="choose(${i})" ${state.checked?'disabled':''}><b>${letters[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>${state.checked?feedback(q):''}<div class="actions"><button class="btn secondary" onclick="prev()" ${state.index===0?'disabled':''}>Back</button>${state.checked?`<button class="btn" onclick="next()">${state.index===59?'See results':'Next question'}</button>`:`<button class="btn" onclick="check()" ${state.selected.length!==(q.multi?q.correct.length:1)?'disabled':''}>Check answer</button>`}</div></article></div>`;scrollTo(0,0)}
window.choose=i=>{let q=questions.filter(q=>q.set===state.set)[state.index];if(q.multi){state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):state.selected.length<q.correct.length?[...state.selected,i]:state.selected}else state.selected=[i];renderQ()};
window.check=()=>{let q=questions.filter(q=>q.set===state.set)[state.index];state.checked=true;let p=saved(state.set);p.answers=p.answers||{};p.answers[q.id]={selected:state.selected,correct:q.correct.length===state.selected.length&&q.correct.every(x=>state.selected.includes(x))};localStorage.setItem(key(state.set),JSON.stringify(p));renderQ()};
function feedback(q){let ok=q.correct.length===state.selected.length&&q.correct.every(x=>state.selected.includes(x));return `<div class="feedback ${ok?'':'bad'}"><strong>${ok?'Correct.':'Not quite.'} Answer: ${q.correct.map(i=>letters[i]).join(', ')}</strong>${esc(q.why)}</div>`}window.next=()=>{if(state.index===59)return results();state.index++;state.selected=[];state.checked=false;renderQ()};window.prev=()=>{if(state.index){state.index--;state.selected=[];state.checked=false;renderQ()}};window.jump=d=>{let qs=questions.filter(q=>q.set===state.set),i=qs.findIndex(q=>q.domain===d);state.index=i;state.selected=[];state.checked=false;renderQ()};
function results(){let p=saved(state.set),qs=questions.filter(q=>q.set===state.set),correct=Object.values(p.answers||{}).filter(x=>x.correct).length;p.complete=true;localStorage.setItem(key(state.set),JSON.stringify(p));app.innerHTML=`<div class="result"><div class="eyebrow">Practice set ${state.set} complete</div><div class="big">${correct}/60</div><h1>Review by domain</h1><p class="lead">The real exam uses a scaled score, so this raw practice score is diagnostic, not a predicted pass result.</p><div class="resultgrid">${domains.map(d=>{let a=qs.filter(q=>q.domain===d[0]),n=a.filter(q=>p.answers?.[q.id]?.correct).length;return `<div class="resultrow"><b>D${d[0]} · ${d[1]}</b><br><span style="color:var(--muted)">${n}/${a.length} correct · ${Math.round(n/a.length*100)}%</span></div>`}).join('')}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="reviewMissed()">Review missed</button><button class="btn secondary" onclick="resetSet()">Reset set</button><button class="btn secondary" onclick="home()">Home</button></div></div>`;scrollTo(0,0)}
window.reviewMissed=()=>{let p=saved(state.set),qs=questions.filter(q=>q.set===state.set),i=qs.findIndex(q=>p.answers?.[q.id]&&!p.answers[q.id].correct);state.index=i<0?0:i;state.selected=[];state.checked=false;renderQ()};window.resetSet=()=>{localStorage.removeItem(key(state.set));start(state.set)};home();
</script></body></html>
