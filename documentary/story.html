  composer.render();

  // lower third on a speaker's first interview appearance
  let lo = 0;
  if (SETS[beat.shot] && shot === beat.shot) {
    const who = beat.speakers[0];
    if (firstSeen[who] === beat.start) {
      lo = clamp((t - beat.start - .35) / .5) * clamp((Math.min(beat.end - .2, beat.start + 3.6) - t) / .4);
      const c = TL.cast[who]; ui.lname.textContent = c.name; ui.lrole.textContent = c.role;
      ui.lower.style.left = "150px";
    }
  }
  ui.lower.style.opacity = lo; ui.rule.style.width = `${ease(clamp((t - beat.start - .3) / .7)) * 110}px`;
  const c = TL.captions.find((c) => t >= c.start - .05 && t < c.end + .3);
  ui.cap.textContent = c ? c.text : "";
}
window.setTimeline = setTimeline;
window.renderAt = renderAt;
window.fontsReady = () => document.fonts.ready.then(() => Promise.all(['200 40px "Inter"', '300 40px "Inter"', '400 40px "Inter"', '500 40px "Inter"', '600 40px "Inter"', '700 40px "Inter"', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'].map((f) => document.fonts.load(f))));
</script>
