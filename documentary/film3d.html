function animateDust(pts, t) {

  for (let i = 0; i < p.length; i += 3) { p[i] = b[i] + Math.sin(t * .3 + i) * .03; p[i + 1] = b[i + 1] + Math.sin(t * .2 + i * .7) * .04 + t * .004; p[i + 2] = b[i + 2] + Math.cos(t * .25 + i) * .03; }
  pts.geometry.attributes.position.needsUpdate = true;
}
const sup = document.getElementById("super"), lower = document.getElementById("lower"), rule = document.getElementById("rule"), cap = document.getElementById("cap");

function renderAt(t, frame) {
  const cold = TL.scenes[0], cut = cold.marks.l1 - .15, back = cold.marks.l2 - .2;
  const interview = t >= cut && t < back;
  let scene, cam, focus;
  if (!interview) {
    scene = A; cam = camA;
    const p = ease(clamp(t / 10));
    const hand = [Math.sin(t * .9) * .006 + Math.sin(t * 2.3) * .002, Math.cos(t * .7) * .004];
    cam.position.set(lerp(.75, .42, p) + hand[0], lerp(1.34, 1.22, p) + hand[1], lerp(.55, -.7, p));
    cam.lookAt(.18 + hand[0] * 2, 1.08, -1.95);
    focus = cam.position.distanceTo(new THREE.Vector3(.25, 1.16, -1.95));
    drawScreen(t); drawRain(t); animateDust(A.userData.dust, t);
  } else {
    scene = B; cam = camB;
    const lt = t - cut;
    cam.position.set(-.05 + lt * .012, 1.38 + Math.sin(t * .8) * .004, .45 - lt * .04);
    cam.lookAt(.42, 1.32, -1.6);
    focus = cam.position.distanceTo(new THREE.Vector3(.55, 1.4, -1.55));
    B.userData.fig.rotation.y = -.25 + Math.sin(t * .6) * .015;
    B.userData.fig.position.y = Math.sin(t * 1.5) * .003;
    animateDust(B.userData.dust, t);
  }
  renderPass.scene = scene; renderPass.camera = cam;
  bokeh.scene = scene; bokeh.camera = cam;
  bokeh.uniforms.focus.value = focus;
  bokeh.uniforms.aperture.value = interview ? .07 : .02;
  bokeh.uniforms.maxblur.value = interview ? .03 : .016;
  bokeh.uniforms.nearClip.value = cam.near; bokeh.uniforms.farClip.value = cam.far;
  bloom.strength = interview ? .9 : .7;
  grade.uniforms.time.value = frame / 30;
  grade.uniforms.fade.value = clamp(t / 1.6) * (1 - .25 * Math.max(0, Math.sin(frame * 1.7)) * (hash(frame) > .93 ? 1 : 0));
  composer.render();

  // overlays
  const sp = interview ? 0 : clamp((t - 1.0) / .8) * (1 - clamp((t - (cut - .4)) / .4));
  sup.style.opacity = sp; sup.style.transform = `translateY(${(1 - ease(sp)) * 10}px)`;
  const lp = interview ? clamp((t - cut - .35) / .6) : 0;
  lower.style.opacity = lp; rule.style.width = `${ease(clamp((t - cut - .3) / .7)) * 120}px`;
  const c = captionAt(t);
  cap.innerHTML = c ? (c.who === "V" ? `<i>${c.text}</i>` : c.text) : "";
}
function lerp(a, b, p) { return a + (b - a) * p; }
window.setTimeline = (tl) => { TL = tl; };
window.renderAt = renderAt;
window.fontsReady = () => document.fonts.ready.then(() => Promise.all([document.fonts.load('300 40px "Inter"'), document.fonts.load('500 40px "Inter"'), document.fonts.load('700 40px "Inter"'), document.fonts.load('italic 500 40px "Inter"'), document.fonts.load('400 20px "JetBrains Mono"'), document.fonts.load('600 20px "JetBrains Mono"')]));
window.sceneReady = true;
</script>
